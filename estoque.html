<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque atual - Estoque da Cozinha</title>
    <script>
        // Aplica o tema salvo antes da página desenhar, pra não piscar claro->escuro.
        (function () {
            if (localStorage.getItem("tema") === "escuro") {
                document.documentElement.setAttribute("data-tema", "escuro");
            }
        })();
    </script>
    <link rel="stylesheet" href="style.css?v=8">
</head>
<body>

<button id="temaToggle" class="temaToggle" type="button" aria-label="Alternar modo escuro">🌙</button>

<div class="container">

    <section id="estoqueTela">

        <header>
            <div>
                <h1>🍳 Estoque atual</h1>
            </div>

            <div class="botoesHeader">
                <a href="index.html" class="btn cinza">Voltar</a>
                <button id="logout" class="btn vermelho">Sair</button>
            </div>
        </header>

        <!-- ESTOQUE -->
        <section class="card">
            <div class="titulo">
                <div>
                    <h2>Estoque atual</h2>
                    <p>Controle as quantidades dos produtos.</p>
                </div>

                <div class="botoesTitulo">
                    <button id="atualizar" class="btn cinza">Atualizar</button>
                </div>
            </div>

            <input type="text" id="buscaItens" placeholder="Buscar item (ex.: Arroz)">

            <div id="lista"></div>
        </section>

    </section>

</div>

<div id="modalQuantidade" class="overlay hidden">
    <div class="modalCaixa card">
        <h2 id="modalTitulo">Adicionar quantidade</h2>
        <p id="modalItemNome" class="modalItemNome"></p>

        <label for="modalQuantidadeInput">Quantidade</label>
        <input type="number" id="modalQuantidadeInput" min="0.01" step="0.01" placeholder="Ex.: 2">

        <p id="modalErro" class="erro"></p>

        <div class="modalBotoes">
            <button id="modalCancelar" class="btn cinza" type="button">Cancelar</button>
            <button id="modalConfirmar" class="btn azul" type="button">Confirmar</button>
        </div>
    </div>
</div>

<script src="tema.js?v=1"></script>
<script src="transicao.js?v=2"></script>
<script src="estoque.js?v=3"></script>
</body>
</html>
